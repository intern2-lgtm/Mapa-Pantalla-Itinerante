
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Totonicapán | Geografía de Encuentros</title>

    <link rel="stylesheet" href="../css/departament-pages.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">

</head>


<body>

<div class="page">


    <!-- =========================================
         CABECERA
    ========================================== -->

    <header class="header">

        <a href="../index.html" class="back-link">
            ← Geografía de Encuentros
        </a>

        <h1>Totonicapán</h1>

    </header>



    <!-- =========================================
         CONTENIDO
    ========================================== -->

    <main class="layout">


        <!-- =====================================
             COLUMNA IZQUIERDA
        ====================================== -->

        <section class="events">

            <p class="section-title">
                Funciones realizadas
            </p>


            <!-- TOTONICAPÁN -->

            <article
                class="event-card"
                data-location="totonicapan"
                data-photo="../media/photos/totonicapan/totonicapan.jpg"
                data-host="Festivales Solidarios"
                data-language="K&#x27;iche&#x27;"
                data-film="El Silencio del Topo"
                data-director="Anaïs Taracena"
                data-country="Guatemala">

                <span class="year">2024</span>

                <h2>
                    Pantalla Itinerante Totonicapan
                </h2>

                <p class="place">
                    Totonicapan
                </p>

            </article>



            <!-- =================================
                 FICHA
            ================================== -->

            <aside
                class="event-details"
                aria-live="polite"
                aria-hidden="true">

                <p data-detail-row="host">
                    <span>Anfitrión</span>
                    <strong data-detail="host"></strong>
                </p>

                <p data-detail-row="language">
                    <span>Idioma de la región</span>
                    <strong data-detail="language"></strong>
                </p>

                <p data-detail-row="film">
                    <span>Película</span>
                    <strong data-detail="film"></strong>
                </p>

                <p data-detail-row="director">
                    <span>Director</span>
                    <strong data-detail="director"></strong>
                </p>

                <p data-detail-row="country">
                    <span>País</span>
                    <strong data-detail="country"></strong>
                </p>

                <button
                    class="event-details-back"
                    type="button"
                    aria-label="Volver a funciones realizadas">

                    <span aria-hidden="true">←</span>

                    Volver a funciones

                </button>

            </aside>

        </section>



        <!-- =====================================
             MAPA
        ====================================== -->

        <section class="map-panel">

            <div class="map-wrapper">

                <svg
                    class="map-svg"
                    viewBox="0 0 559.31 385.53"
                    preserveAspectRatio="none"
                    aria-label="Mapa de Totonicapán">

                    <defs>

                        <mask
                            id="departmentMask"
                            maskUnits="userSpaceOnUse"
                            x="0"
                            y="0"
                            width="559.31"
                            height="385.53"
                            mask-type="alpha">

                            <image
                                href="../media/departments/totonicapan-mask.svg"
                                x="0"
                                y="0"
                                width="559.31"
                                height="385.53"
                                preserveAspectRatio="none">
                            </image>

                        </mask>

                    </defs>


                    <!-- SILUETA NEGRA -->

                    <rect
                        class="map-fill"
                        x="0"
                        y="0"
                        width="559.31"
                        height="385.53"
                        mask="url(#departmentMask)">
                    </rect>


                    <!-- FOTOS RECORTADAS POR LA SILUETA -->

                    <g
                        class="photos-layer"
                        mask="url(#departmentMask)">

                        <g class="location-photos"></g>

                    </g>


                    <!-- CAPA DE CONEXIONES -->

                    <g class="connections-layer">

                        <g class="connection-lines"></g>

                    </g>


                    <!-- CAPA DE MARCADORES -->

                    <g class="locations-layer">

                        <g class="location-markers"></g>

                    </g>

                </svg>

            </div>

        </section>

    </main>

</div>


<script src="../js/departament-pages.js"></script>

</body>

</html>
